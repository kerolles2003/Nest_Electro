# Nest Electro — Flutter APK build (manual, user-triggered)
#
# Builds a release APK of the customer storefront app on GitHub Actions.
# The APK cannot be built in the sandbox (no Android SDK) and must not be
# built on the owner's machine either, so this workflow is the build route.
#
# The API base URL is baked into the APK at build time via --dart-define,
# so it is a required workflow input with no default: a physical phone
# cannot reach the Android-emulator address 10.0.2.2, it needs the PC's
# LAN IP (e.g. http://192.168.1.5:3002/api/v1). A wrong default would
# silently produce a broken APK.
#
# No deploy, no secrets, no keystore: the release buildType signs with
# the debug keys (android/app/build.gradle.kts: "Signing with the debug
# keys for now, so `flutter run --release` works"), so the APK installs
# on a personal device (allow install from unknown sources).
#
# Trigger: Actions tab → Mobile APK → Run workflow → pick branch
# flutter-app → type the API URL → Run workflow.

name: Mobile APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL the APK talks to — your PC LAN IP, e.g. http://192.168.1.5:3002/api/v1'
        required: true
        type: string

# Least privilege: this job only reads the repo and reports checks.
permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the SDK the app was built and verified against
          # (Flutter 3.35.7 / Dart 3.9.2). Bump deliberately, never
          # implicitly, so a new SDK cannot silently change the gate.
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Validate API URL
        run: |
          case "${{ inputs.api_base_url }}" in
            http://10.0.2.2*|http://localhost*|http://127.0.0.1*)
              echo "::error::api_base_url points at the emulator/loopback address, which a physical phone cannot reach. Use your PC's LAN IP instead (e.g. http://192.168.1.5:3002/api/v1)."
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define="API_BASE_URL=${{ inputs.api_base_url }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nest-electro-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## Nest Electro APK"
            echo ""
            echo "Built against API: \`${{ inputs.api_base_url }}\`"
            echo ""
            echo "APK: \`app-release.apk\` (release, signed with debug keys — install on a personal device; allow install from unknown sources)."
          } >> "$GITHUB_STEP_SUMMARY"
